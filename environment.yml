name: Nightingale
channels:
  - defaults
dependencies:
  # Version families from the currently verified Nightingale Conda environment.
  # Patch releases may differ between Windows x64 and Apple Silicon macOS.
  - python>=3.14,<3.15
  - psycopg>=3.3,<3.4
  - pytorch>=2.13,<2.14
  - transformers>=5.15,<5.16
  - huggingface_hub>=1.15,<1.16
  - accelerate>=1.13,<1.14
  - pip
  - pip:
      - phileas-redact==1.0.0
